
services:

  # DATABASE MYSQL
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - syakiratask-network

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1
          -u"$$MYSQL_USER"
          -p"$$MYSQL_PASSWORD"
          -e 'SELECT 1' "$$MYSQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # BACKEND LARAVEL + FRANKENPHP
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: SyakiraTask
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - php artisan migrate --force && exec frankenphp run --config /etc/caddy/Caddyfile

    networks:
      - syakiratask-network

  # FRONTEND VUE + NGINX
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - syakiratask-network


# NAMED VOLUME UNTUK PERSISTENSI MYSQL
volumes:
  mysql_data:


# JARINGAN INTERNAL DOCKER COMPOSE
networks:
  syakiratask-network:
    driver: bridge